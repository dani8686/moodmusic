name: Build, test and sign Mood Music Sorter

on:
  push:
    branches: [ '**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install SDK 34 / build-tools 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null

      # The private key is never checked into Git. Preferred source is a repository
      # Actions secret. If it is not configured (this token cannot create secrets),
      # a new key is generated once on the runner and kept in the private Actions
      # cache so repeated builds share the same signing identity.
      - name: Restore signing-key cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mood-signing
          key: moodmusic-release-key-v2

      - name: Configure release signing key
        run: |
          set -euo pipefail
          DIR="${{ runner.temp }}/mood-signing"
          mkdir -p "$DIR"
          if [ -n "${{ secrets.MOOD_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MOOD_KEYSTORE_BASE64 }}" | base64 -d > "$DIR/release.p12"
            PASS="${{ secrets.MOOD_STORE_PASSWORD }}"
            ALIAS="${{ secrets.MOOD_KEY_ALIAS }}"
            KEYPASS="${{ secrets.MOOD_KEY_PASSWORD }}"
            echo "SIGNING_SOURCE=github-secret" >> "$GITHUB_ENV"
          else
            if [ ! -f "$DIR/release.p12" ]; then
              PASS="$(openssl rand -hex 24)"
              keytool -genkeypair -noprompt \
                -alias moodmusic -keyalg RSA -keysize 2048 -validity 10950 \
                -storetype PKCS12 -keystore "$DIR/release.p12" \
                -storepass "$PASS" -keypass "$PASS" \
                -dname "CN=Mood Music Sorter, OU=Release, O=Danial Mousavi, C=NL"
              printf '%s' "$PASS" > "$DIR/password.txt"
              echo "SIGNING_SOURCE=generated-new-key" >> "$GITHUB_ENV"
            else
              echo "SIGNING_SOURCE=actions-cache" >> "$GITHUB_ENV"
            fi
            PASS="$(cat "$DIR/password.txt")"
            ALIAS="moodmusic"
            KEYPASS="$PASS"
          fi
          [ -n "$ALIAS" ] || ALIAS="moodmusic"
          [ -n "$KEYPASS" ] || KEYPASS="$PASS"
          echo "::add-mask::$PASS"
          echo "::add-mask::$KEYPASS"
          echo "MOOD_STORE_FILE=$DIR/release.p12" >> "$GITHUB_ENV"
          echo "MOOD_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MOOD_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "MOOD_KEY_PASSWORD=$KEYPASS" >> "$GITHUB_ENV"

      - name: Kotlin / JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug + release APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Validate the release APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then
            echo "INTERNET permission must not be declared" >&2
            exit 1
          fi
          echo "--- badging ---"
          "$AAPT" dump badging "$APK" | head -8
          echo "--- signature ---"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "MoodMusicSorter-v2.0.0-release.apk"
          stat -c 'APK size: %s bytes' "MoodMusicSorter-v2.0.0-release.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MoodMusicSorter-v2-APK
          path: |
            MoodMusicSorter-v2.0.0-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 30
