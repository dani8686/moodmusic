name: Test and build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ main, arena/fa1fad68-moodmusic ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu image already includes the Android SDK command-line tools.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Unit tests, lint and debug APK
        run: |
          if ! gradle --no-daemon --console=plain --stacktrace :app:assembleDebug :app:testDebugUnitTest :app:lintDebug > /tmp/mood-build.log 2>&1; then
            cat /tmp/mood-build.log
            find "$HOME/.gradle/daemon" -name '*.log' -type f -exec tail -n 80 {} \; > /tmp/mood-daemon.log 2>/dev/null || true
            cat /tmp/mood-daemon.log
            { grep -E '^e:| error: |AAPT.*error|OutOfMemoryError|FAILED|AssertionError|ComparisonFailure|IllegalStateException|Lint found|Lint error|\.xml:.*Error|\.kt:.*Error|expected:|Expected|Room.*error|Migration.*fail' /tmp/mood-build.log || true; } | tail -n 10 | while IFS= read -r line; do printf '::error::%s\n' "$line"; done
            exit 1
          fi
          cat /tmp/mood-build.log
      - name: Preserve failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log-${{ github.run_number }}
          path: |
            /tmp/mood-build.log
            /tmp/mood-daemon.log
          if-no-files-found: ignore
      - name: Decode optional production signing key
        env:
          MOOD_KEYSTORE_BASE64: ${{ secrets.MOOD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MOOD_KEYSTORE_BASE64" ]; then
            echo '::warning::Production signing secrets are unavailable. Building a debug-signed TEST release; do not use it for production updates.'
          else
            printf '%s' "$MOOD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mood-release.p12"
            chmod 600 "$RUNNER_TEMP/mood-release.p12"
          fi
      - name: Build signed release APK
        env:
          MOOD_KEYSTORE_FILE: ${{ runner.temp }}/mood-release.p12
          MOOD_KEYSTORE_PASSWORD: ${{ secrets.MOOD_KEYSTORE_PASSWORD }}
          MOOD_KEY_ALIAS: ${{ secrets.MOOD_KEY_ALIAS }}
          MOOD_KEY_PASSWORD: ${{ secrets.MOOD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Validate APK package, signing and privacy permissions
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 8
          if ! "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.daniel.mood' versionCode='30' versionName='3.0'"; then echo '::error::APK package/version validation failed'; exit 1; fi
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" | tee /tmp/permissions.txt
          if ! grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then echo '::error::Expected optional online INTERNET permission is missing'; exit 1; fi
          if grep -q 'android.permission.RECORD_AUDIO' /tmp/permissions.txt; then echo '::error::Unexpected microphone permission'; exit 1; fi
          sha256sum "$APK" | tee app/build/outputs/apk/release/app-release.apk.sha256
      - name: Publish installable test APK and exact metadata
        if: github.ref == 'refs/heads/arena/fa1fad68-moodmusic'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" /tmp/MoodMusicSorter-3.0-test.apk
          cp app/build/outputs/apk/release/app-release.apk.sha256 /tmp/MoodMusicSorter-3.0-test.apk.sha256
          {
            echo 'Mood Music Sorter 3.0 — installable TEST APK'
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -n 1
            echo "APK bytes: $(stat -c '%s' "$APK")"
            echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo 'Signing: debug-signed test release unless MOOD_* production secrets are configured.'
            echo 'Physical Redmi/MIUI/OTG/Bluetooth testing is still required.'
          } > /tmp/APK-INFO.txt
          if ! gh release view v3.0.0-test >/dev/null 2>&1; then
            gh release create v3.0.0-test --prerelease --target "$GITHUB_SHA" --title 'Mood Music Sorter 3.0 — Test' --notes 'Integrated V3 test build. See APK-INFO.txt and README.md. Production signing requires MOOD_* Actions secrets.'
          fi
          gh release upload v3.0.0-test --clobber /tmp/MoodMusicSorter-3.0-test.apk /tmp/MoodMusicSorter-3.0-test.apk.sha256 /tmp/APK-INFO.txt
      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodMusicSorter-3.0-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload debug APK and test reports
        uses: actions/upload-artifact@v4
        with:
          name: MoodMusicSorter-3.0-debug-and-tests
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/
          if-no-files-found: error
          retention-days: 30
