name: Build signed APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack phone-uploaded source (if present)
        run: |
          if [ -f "mood-source.zip" ]; then
            unzip -oq "mood-source.zip"
          elif [ -f "mood-source (1).zip" ]; then
            unzip -oq "mood-source (1).zip"
          fi
      - name: Locate Android Gradle project
        run: |
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "No settings.gradle or settings.gradle.kts found. Check that the source ZIP contains the Android project." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "Gradle project found at '$PROJECT_DIR', but it has no app module directory." >&2
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project at: $PROJECT_DIR"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install SDK 34
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"
      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleRelease
          APK="$(find app/build/outputs/apk/release -type f -name 'app-release.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "Gradle completed, but app-release.apk was not produced." >&2
            exit 1
          fi
          echo "APK_PATH=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"
      - name: Check that no INTERNET permission is declared
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK_PATH" | tee /tmp/permissions.txt
          if grep -q 'android.permission.INTERNET' /tmp/permissions.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: MoodMusicSorter-signed-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30
